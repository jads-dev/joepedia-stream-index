name: Generate

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-wikitext:
    name: Generate wikitext from spreadsheet data.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          python-version: "3.15"

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Generate wikitext.
        run: uv run stream-index.py --download --update-wiki --lookup
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MEDIAWIKI_BOT_USER: ${{ secrets.MEDIAWIKI_BOT_USER }}
          MEDIAWIKI_BOT_PASSWORD: ${{ secrets.MEDIAWIKI_BOT_PASSWORD }}
          IGDB_ID: ${{ secrets.IGDB_ID }}
          IGDB_SECRET: ${{ secrets.IGDB_SECRET }}
          UPDATE_REASON: ${{ github.event_name == 'push' && 'the script was updated' || 'of a scheduled update' }}

      - name: Upload generated wikitext.
        uses: actions/upload-artifact@v7
        with:
          name: stream-index
          path: stream-index.txt
          compression-level: 9
